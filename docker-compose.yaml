version: "3.8"

services:
  backend:
    build: .
    container_name: borai_backend
    ports:
      - "7373:7373"
    depends_on:
      - mongodb
      - redisdb
    env_file:
      - .env
    networks:
      - default_network

  mongodb:
    image: mongodb/mongodb-community-server:latest
    container_name: borai_mongodb
    ports:
      - "27019:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - default_network

  redisdb:
    image: redis:latest
    container_name: borai_redisdb
    ports:
      - "6377:6379"
    networks:
      - default_network

volumes:
  mongo-data:

networks:
  default_network: